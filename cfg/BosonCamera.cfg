from dynamic_reconfigure.parameter_generator_catkin import ParameterGenerator, bool_t, int_t, double_t, str_t

PACKAGE = 'flir_boson_usb'

gen = ParameterGenerator()

# The palette names have to match the palette table in src/Pipeline.cpp. A palette the built OpenCV does not
# have is refused by the node, which keeps painting with the palette it used so far.
COLORMAPS = [
  "autumn",
  "bone",
  "jet",
  "winter",
  "rainbow",
  "ocean",
  "summer",
  "spring",
  "cool",
  "hsv",
  "pink",
  "hot",
  "parula",
  "magma",
  "inferno",
  "plasma",
  "viridis",
  "cividis",
  "twilight",
  "twilight_shifted",
  "turbo",
  "deepgreen",
]
colormap_enum = gen.enum([gen.const(c, str_t, c, c) for c in COLORMAPS], "Colormap")

# The overlay names have to match the overlay table in src/pipeline.cpp. An unknown content is refused by
# the node, which keeps stamping whatever it stamped so far.
OVERLAY_MODES = [
  "none",
  "min_max_ptr",
  "min_max",
  "ptr",
]
overlay_mode_enum = gen.enum([gen.const(m, str_t, m, m) for m in OVERLAY_MODES], "Overlay")

gen.add('point_x', int_t, 0, 'point x', 319, 0, 639)
gen.add('point_y', int_t, 0, 'point y', 255, 0, 511)
gen.add('max_temp_limit', int_t, 0, 'upper bound of the fixed_range stretch in degrees Celsius', 50, -273, 655 - 273)
gen.add('min_temp_limit', int_t, 0, 'lower bound of the fixed_range stretch in degrees Celsius', 20, -273, 655 - 273)
gen.add('agc_norm', bool_t, 0, 'renormalise image_visual to the observed frame bounds', False)
gen.add('agc_norm_margin', double_t, 0, 'how much wider the observed bounds are taken when agc_norm is on', 20, 0, 120)
gen.add('agc_low_pct', double_t, 0, 'bottom-tail clip percentage of the frame AGC', 1.0, 0.0, 50.0)
gen.add('agc_high_pct', double_t, 0, 'top-tail clip percentage of the frame AGC', 1.0, 0.0, 50.0)
gen.add('colormap', str_t, 0, 'palette image_heatmap is painted with', 'jet', edit_method=colormap_enum)
gen.add('overlay_mode', str_t, 0, 'what is stamped on image_heatmap', 'min_max_ptr', edit_method=overlay_mode_enum)

exit(gen.generate(PACKAGE, PACKAGE, 'BosonCamera'))
